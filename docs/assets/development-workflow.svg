<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Project-state backlog development workflow</title>
  <desc id="description">Setup creates an accepted-state wiki and desired-change backlog. Discussion routes current facts to the wiki and desired changes to backlog preparation and optional research. Ready work is implemented directly or with sequential subagents, reviewed against standards and work-item scope, reconciled into accepted knowledge, and archived.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ed"/>
      <stop offset="1" stop-color="#e8eef0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#183049" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#17324d"/>
    </marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c95f42"/>
    </marker>
    <style>
      .stage { font: 700 18px ui-sans-serif, system-ui, sans-serif; letter-spacing: 2px; fill: #5a6a72; }
      .name { font: 700 24px ui-sans-serif, system-ui, sans-serif; fill: #17324d; }
      .small { font: 500 17px ui-sans-serif, system-ui, sans-serif; fill: #52646d; }
      .label { font: 700 15px ui-sans-serif, system-ui, sans-serif; letter-spacing: 1px; fill: #ffffff; }
      .flow { fill: none; stroke: #17324d; stroke-width: 4; marker-end: url(#arrow-navy); }
      .return { fill: none; stroke: #c95f42; stroke-width: 4; marker-end: url(#arrow-coral); }
      .card { fill: #fffdf8; stroke: #9babb2; stroke-width: 2; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <text x="70" y="72" class="name" font-size="34">From project state to accepted outcomes</text>
  <text x="70" y="108" class="small">Current knowledge and desired work stay separate until implementation is accepted.</text>

  <text x="70" y="170" class="stage">1 / SET UP</text>
  <text x="390" y="170" class="stage">2 / ROUTE</text>
  <text x="735" y="170" class="stage">3 / PREPARE</text>
  <text x="1070" y="170" class="stage">4 / EXECUTE</text>
  <text x="1350" y="170" class="stage">5 / ACCEPT</text>

  <rect x="60" y="205" width="250" height="115" rx="18" class="card" stroke="#255c78"/>
  <rect x="60" y="205" width="250" height="32" rx="18" fill="#255c78"/>
  <text x="185" y="227" text-anchor="middle" class="label">FOUNDATION</text>
  <text x="185" y="274" text-anchor="middle" class="name">setup-project</text>
  <text x="185" y="300" text-anchor="middle" class="small">initialize or upgrade</text>

  <rect x="60" y="370" width="250" height="125" rx="18" fill="#f8fbfc" stroke="#25758a" stroke-width="2"/>
  <text x="185" y="414" text-anchor="middle" class="name">docs/wiki</text>
  <text x="185" y="445" text-anchor="middle" class="small">accepted current state</text>
  <text x="185" y="472" text-anchor="middle" class="small">on the primary branch</text>

  <rect x="60" y="550" width="250" height="125" rx="18" fill="#fff8f2" stroke="#c95f42" stroke-width="2"/>
  <text x="185" y="594" text-anchor="middle" class="name">docs/backlog</text>
  <text x="185" y="625" text-anchor="middle" class="small">desired deltas, rank,</text>
  <text x="185" y="652" text-anchor="middle" class="small">evidence, and execution</text>

  <path d="M185 320V350H185V370" class="flow"/>
  <path d="M185 320V525H185V550" class="return"/>

  <rect x="380" y="205" width="250" height="115" rx="18" class="card"/>
  <rect x="380" y="205" width="250" height="32" rx="18" fill="#48637a"/>
  <text x="505" y="227" text-anchor="middle" class="label">EXPLORE</text>
  <text x="505" y="274" text-anchor="middle" class="name">discuss</text>
  <text x="505" y="300" text-anchor="middle" class="small">resolve one decision at a time</text>

  <rect x="380" y="370" width="250" height="125" rx="18" class="card" stroke="#25758a"/>
  <text x="505" y="414" text-anchor="middle" class="name">wiki</text>
  <text x="505" y="445" text-anchor="middle" class="small">accepted knowledge lifecycle</text>
  <text x="505" y="472" text-anchor="middle" class="small">discover, validate, maintain</text>

  <rect x="380" y="550" width="250" height="125" rx="18" class="card" stroke="#c95f42"/>
  <text x="505" y="594" text-anchor="middle" class="name">backlog</text>
  <text x="505" y="625" text-anchor="middle" class="small">approved Epic or work item</text>
  <text x="505" y="652" text-anchor="middle" class="small">intake and refinement</text>

  <path d="M310 262H380" class="flow"/>
  <path d="M505 320V370" class="flow"/>
  <path d="M505 320V550" class="return"/>
  <text x="520" y="348" class="small">current fact</text>
  <text x="520" y="530" class="small" fill="#a54934">desired change</text>
  <path d="M380 432H335V432H310" class="flow"/>
  <path d="M380 612H335V612H310" class="return"/>

  <rect x="720" y="370" width="270" height="125" rx="18" class="card" stroke="#8d6a2d" stroke-dasharray="8 7"/>
  <text x="855" y="414" text-anchor="middle" class="name">research-tech-stack</text>
  <text x="855" y="445" text-anchor="middle" class="small">optional, proposal-specific</text>
  <text x="855" y="472" text-anchor="middle" class="small">version-matched evidence</text>

  <rect x="720" y="550" width="270" height="125" rx="18" fill="#fff8f2" stroke="#c95f42" stroke-width="2"/>
  <text x="855" y="594" text-anchor="middle" class="name">ready backlog work</text>
  <text x="855" y="625" text-anchor="middle" class="small">EPIC-NNN or WORK-NNN</text>
  <text x="855" y="652" text-anchor="middle" class="small">approved, ranked, actionable</text>

  <path d="M630 612H720" class="return"/>
  <path d="M670 612V432H720" class="flow"/>
  <path d="M855 495V550" class="flow"/>

  <rect x="1060" y="300" width="250" height="115" rx="18" class="card" stroke="#2f796f"/>
  <text x="1185" y="345" text-anchor="middle" class="name">implement</text>
  <text x="1185" y="376" text-anchor="middle" class="small">one item or one Epic</text>

  <rect x="1060" y="465" width="250" height="135" rx="18" class="card" stroke="#2f796f"/>
  <text x="1185" y="507" text-anchor="middle" class="name">implement-with-</text>
  <text x="1185" y="536" text-anchor="middle" class="name">subagents</text>
  <text x="1185" y="570" text-anchor="middle" class="small">one sequential agent per item</text>

  <path d="M990 612H1020V357H1060" class="flow"/>
  <path d="M1020 532H1060" class="flow"/>
  <text x="1038" y="640" text-anchor="middle" class="small">choose one</text>

  <rect x="1360" y="205" width="180" height="125" rx="18" class="card" stroke="#8d6a2d"/>
  <text x="1450" y="250" text-anchor="middle" class="name">code-review</text>
  <text x="1450" y="281" text-anchor="middle" class="small">Standards + Spec</text>
  <text x="1450" y="306" text-anchor="middle" class="small">independent axes</text>

  <rect x="1360" y="420" width="180" height="150" rx="18" fill="#eef7f5" stroke="#2f796f" stroke-width="2"/>
  <text x="1450" y="463" text-anchor="middle" class="name">reconcile</text>
  <text x="1450" y="494" text-anchor="middle" class="small">primary acceptance</text>
  <text x="1450" y="521" text-anchor="middle" class="small">wiki current state</text>
  <text x="1450" y="548" text-anchor="middle" class="small">backlog archive</text>

  <path d="M1310 357H1335V267H1360" class="flow"/>
  <path d="M1310 532H1335V267H1360" class="flow"/>
  <path d="M1450 330V420" class="flow"/>
  <path d="M1360 267H1330V720H1185V600" class="return"/>
  <text x="1240" y="747" class="small" fill="#a54934">findings return to implementation</text>

  <path d="M1360 495H1328V795H185V675" class="return"/>
  <path d="M1360 470H1300V760H185V495" class="flow"/>
  <text x="665" y="790" text-anchor="middle" class="small">accepted outcomes update canonical knowledge; terminal records preserve delivery history</text>
</svg>
